[tool.poetry]
name = "mcp-agent-base"
version = "0.1.1"
description = "A framework for building MCP-based agents"
authors = ["mscherenberg"]
readme = "README.md"
license = "MIT"
packages = [{include = "mcp_agent_base", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
mcp = "^1.12.0"
openai = "^1.79.0"
pygithub = "^2.6.1"
pydantic = "^2.11.0"
pydantic-settings = "^2.9.0"
python-dotenv = "^1.0.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true